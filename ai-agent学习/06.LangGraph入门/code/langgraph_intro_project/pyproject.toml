[project]
name = "langgraph-intro-project"
version = "0.1.0"
description = "资料检索与总结 Agent：LangGraph 入门教程贯穿项目"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
