<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#ffffff}</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="100%" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <text x="340" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#444441">乐高类比：数据是积木，本体是说明书</text>

  <rect x="40" y="44" width="240" height="170" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text x="160" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#444441">一堆积木（数据）</text>

  <rect x="70" y="90" width="64" height="26" rx="4" fill="#F09595" stroke="#A32D2D" stroke-width="0.8"/>
  <circle cx="82" cy="98" r="2.5" fill="#FFFFFF"/><circle cx="94" cy="98" r="2.5" fill="#FFFFFF"/><circle cx="106" cy="98" r="2.5" fill="#FFFFFF"/><circle cx="118" cy="98" r="2.5" fill="#FFFFFF"/>
  <rect x="145" y="120" width="44" height="26" rx="4" fill="#85B7EB" stroke="#185FA5" stroke-width="0.8"/>
  <circle cx="155" cy="128" r="2.5" fill="#FFFFFF"/><circle cx="167" cy="128" r="2.5" fill="#FFFFFF"/><circle cx="179" cy="128" r="2.5" fill="#FFFFFF"/>
  <rect x="110" y="150" width="54" height="26" rx="4" fill="#FAC775" stroke="#854F0B" stroke-width="0.8"/>
  <circle cx="122" cy="158" r="2.5" fill="#FFFFFF"/><circle cx="134" cy="158" r="2.5" fill="#FFFFFF"/><circle cx="146" cy="158" r="2.5" fill="#FFFFFF"/>
  <rect x="190" y="96" width="44" height="26" rx="4" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.8"/>
  <circle cx="200" cy="104" r="2.5" fill="#FFFFFF"/><circle cx="212" cy="104" r="2.5" fill="#FFFFFF"/><circle cx="224" cy="104" r="2.5" fill="#FFFFFF"/>

  <text x="160" y="196" text-anchor="middle" font-size="11" fill="#5F5E5A">积木自己不会变成车</text>

  <line x1="280" y1="129" x2="352" y2="129" stroke="#5F5E5A" stroke-width="1.5"/>
  <polygon points="356,129 346,124 346,134" fill="#5F5E5A"/>
  <text x="318" y="118" text-anchor="middle" font-size="11" fill="#5F5E5A">照着拼</text>

  <rect x="360" y="44" width="280" height="170" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="500" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#0C447C">说明书（本体）</text>

  <rect x="390" y="86" width="140" height="100" rx="6" fill="#FFFFFF" stroke="#185FA5" stroke-width="1"/>
  <text x="460" y="106" text-anchor="middle" font-size="11" font-weight="bold" fill="#0C447C">拼装步骤</text>
  <line x1="404" y1="114" x2="516" y2="114" stroke="#85B7EB" stroke-width="0.8"/>
  <text x="425" y="132" text-anchor="middle" font-size="10" fill="#185FA5">① 两块叠起来</text>
  <text x="460" y="152" text-anchor="middle" font-size="10" fill="#185FA5">② 加上轮子</text>
  <text x="460" y="172" text-anchor="middle" font-size="10" fill="#185FA5">③ 拼成一辆车</text>

  <rect x="545" y="110" width="70" height="56" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="580" y="128" text-anchor="middle" font-size="10" fill="#633806">= 业务</text>
  <text x="580" y="144" text-anchor="middle" font-size="10" fill="#633806">（车）</text>
  <text x="580" y="158" text-anchor="middle" font-size="9" fill="#854F0B">拼出来的</text>

  <text x="340" y="248" text-anchor="middle" font-size="12" fill="#5F5E5A">数据是积木，本体是说明书——告诉 AI 这些数据怎么拼成业务</text>
  <text x="340" y="272" text-anchor="middle" font-size="12" fill="#5F5E5A">没有说明书，只有"老玩家"（老员工）记得怎么拼</text>
</svg>
</body>
</html>
