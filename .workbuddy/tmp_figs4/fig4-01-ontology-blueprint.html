<!DOCTYPE html>
<html>

<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="100%" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <text x="340" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#444441">本体论 = 给业务世界画一张「图纸」</text>

  <rect x="180" y="40" width="320" height="58" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="340" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#444441">现实业务世界</text>
  <text x="340" y="84" text-anchor="middle" font-size="11" fill="#5F5E5A">采购 · 合同 · 项目 · 验收 · 风险</text>

  <line x1="340" y1="98" x2="340" y2="126" stroke="#5F5E5A" stroke-width="1.2"/>
  <polygon points="340,130 336,122 344,122" fill="#5F5E5A"/>
  <text x="355" y="112" font-size="11" fill="#5F5E5A">抽象成图纸</text>

  <rect x="140" y="132" width="400" height="66" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <text x="340" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#0C447C">本体模型（图纸）</text>
  <text x="340" y="178" text-anchor="middle" font-size="11" fill="#185FA5">类 | 属性 | 关系 | 规则 —— 合同约束项目、延期超7天触发风险</text>

  <line x1="230" y1="198" x2="160" y2="238" stroke="#5F5E5A" stroke-width="1.2"/>
  <polygon points="158,240 162,232 170,234" fill="#5F5E5A"/>
  <line x1="340" y1="198" x2="340" y2="238" stroke="#5F5E5A" stroke-width="1.2"/>
  <polygon points="340,240 336,232 344,232" fill="#5F5E5A"/>
  <line x1="450" y1="198" x2="520" y2="238" stroke="#5F5E5A" stroke-width="1.2"/>
  <polygon points="522,240 518,232 510,234" fill="#5F5E5A"/>

  <rect x="40" y="242" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="120" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#085041">业务专家</text>
  <text x="120" y="283" text-anchor="middle" font-size="11" fill="#0F6E56">看：概念画对了吗</text>

  <rect x="260" y="242" width="160" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="340" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#633806">程序员</text>
  <text x="340" y="283" text-anchor="middle" font-size="11" fill="#854F0B">看：系统怎么建模</text>

  <rect x="480" y="242" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="560" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#3C3489">AI</text>
  <text x="560" y="283" text-anchor="middle" font-size="11" fill="#534AB7">看：怎么推理业务</text>

  <text x="340" y="322" text-anchor="middle" font-size="12" fill="#5F5E5A">同一张图纸，业务方、程序员、AI 各取所需 —— 这就是原型和图纸做不到的</text>
