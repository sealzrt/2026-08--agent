<!DOCTYPE html>
<html>

  <path d="M268 168 L340 130 L412 168 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>

  <line x1="340" y1="168" x2="340" y2="194" stroke="#854F0B" stroke-width="0.8"/>

  <line x1="260" y1="130" x2="205" y2="130" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="420" y1="130" x2="475" y2="130" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="5 4"/>

  <text x="115" y="144" text-anchor="middle" font-size="11" fill="#0F6E56">看布局合不合心意</text>

  <rect x="480" y="104" width="170" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="565" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#633806">施工队</text>
  <text x="565" y="144" text-anchor="middle" font-size="11" fill="#854F0B">看墙和结构怎么盖</text>

  <rect x="480" y="238" width="170" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="565" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#3C3489">监理</text>
  <text x="565" y="278" text-anchor="middle" font-size="11" fill="#534AB7">看有没有违规</text>

  <text x="340" y="318" text-anchor="middle" font-size="12" fill="#5F5E5A">本体也一样：业务专家看概念、程序员看结构、AI 看推理 —— 都是同一张图</text>
