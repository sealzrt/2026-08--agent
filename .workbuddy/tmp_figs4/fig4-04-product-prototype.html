<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#ffffff}</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="100%" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <text x="340" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#444441">产品原型：让业务方和程序员对齐</text>

  <rect x="40" y="48" width="170" height="70" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="125" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#444441">业务需求</text>
  <text x="125" y="96" text-anchor="middle" font-size="11" fill="#5F5E5A">"要一个能查合同风险的页面"</text>

  <line x1="210" y1="83" x2="250" y2="83" stroke="#5F5E5A" stroke-width="1.2"/>
  <polygon points="253,83 245,79 245,87" fill="#5F5E5A"/>

  <rect x="255" y="48" width="170" height="70" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="340" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#0C447C">原型图</text>
  <text x="340" y="96" text-anchor="middle" font-size="11" fill="#185FA5">画成界面草图，标注交互</text>

  <line x1="425" y1="83" x2="465" y2="83" stroke="#5F5E5A" stroke-width="1.2"/>
  <polygon points="468,83 460,79 460,87" fill="#5F5E5A"/>

  <rect x="470" y="48" width="170" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="555" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#085041">双方对齐</text>
  <text x="555" y="96" text-anchor="middle" font-size="11" fill="#0F6E56">"对，这就是我要的"</text>

  <rect x="40" y="140" width="600" height="66" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text x="340" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#444441">本体模型干的是同一件事，但层次更深</text>
  <text x="340" y="184" text-anchor="middle" font-size="11" fill="#5F5E5A">原型对齐的是「界面长什么样」；本体对齐的是「业务世界长什么样」</text>

  <line x1="340" y1="206" x2="340" y2="230" stroke="#534AB7" stroke-width="1.2"/>
  <polygon points="340,233 336,225 344,225" fill="#534AB7"/>

  <rect x="130" y="234" width="420" height="44" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="340" y="261" text-anchor="middle" font-size="12" fill="#3C3489">业务专家："合同确实约束项目" + 程序员："关系链清楚了" + AI："我可以推理了"</text>
</svg>
</body>
</html>
