<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#ffffff}</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="100%" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <text x="340" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#444441">例：合同系统 —— 业务事实怎么变成本体，再变成 AI 的能力</text>

  <rect x="40" y="48" width="185" height="130" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="132" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#444441">业务专家口中的事实</text>
  <line x1="60" y1="84" x2="205" y2="84" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="132" y="106" text-anchor="middle" font-size="11" fill="#5F5E5A">"合同约束项目"</text>
  <text x="132" y="126" text-anchor="middle" font-size="11" fill="#5F5E5A">"延期超 7 天触发风险"</text>
  <text x="132" y="146" text-anchor="middle" font-size="11" fill="#5F5E5A">"合同有金额、验收条款"</text>

  <line x1="225" y1="113" x2="263" y2="113" stroke="#5F5E5A" stroke-width="1.2"/>
  <polygon points="266,113 258,109 258,117" fill="#5F5E5A"/>

  <rect x="268" y="48" width="165" height="130" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="350" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#0C447C">画成本体</text>
  <line x1="288" y1="84" x2="412" y2="84" stroke="#85B7EB" stroke-width="0.8"/>
  <text x="350" y="106" text-anchor="middle" font-size="11" fill="#185FA5">合同 →约束→ 项目</text>
  <text x="350" y="126" text-anchor="middle" font-size="11" fill="#185FA5">规则：延期>7天→风险</text>
  <text x="350" y="146" text-anchor="middle" font-size="11" fill="#185FA5">属性：金额·验收条款</text>

  <line x1="433" y1="113" x2="471" y2="113" stroke="#5F5E5A" stroke-width="1.2"/>
  <polygon points="474,113 466,109 466,117" fill="#5F5E5A"/>

  <rect x="476" y="48" width="170" height="130" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="561" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#3C3489">AI 能回答</text>
  <line x1="496" y1="84" x2="626" y2="84" stroke="#CECBF6" stroke-width="0.8"/>
  <text x="561" y="106" text-anchor="middle" font-size="11" fill="#534AB7">HT-001 约束哪个项目？</text>
  <text x="561" y="126" text-anchor="middle" font-size="11" fill="#534AB7">风险 R1 何时升级？</text>
  <text x="561" y="146" text-anchor="middle" font-size="11" fill="#534AB7">哪些功能来自这合同？</text>

  <text x="340" y="200" text-anchor="middle" font-size="12" fill="#5F5E5A">三个环节：业务专家「说」→ 建模师「画」→ AI「答」</text>

  <rect x="40" y="220" width="600" height="60" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="340" y="244" text-anchor="middle" font-size="12" font-weight="bold" fill="#633806">这和原型流程一模一样</text>
  <text x="340" y="264" text-anchor="middle" font-size="11" fill="#854F0B">业务方提需求 → 产品画原型 → 程序员照着做；本体就是"业务版的原型"，只是观众多了一个 AI</text>
</svg>
</body>
</html>
