<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#ffffff}</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" width="100%" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <text x="340" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#444441">三种类比：原型、图纸、说明书</text>

  <rect x="30" y="44" width="195" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="127" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#0C447C">产品原型</text>
  <text x="127" y="85" text-anchor="middle" font-size="11" fill="#185FA5">画界面和交互</text>
  <text x="127" y="120" text-anchor="middle" font-size="12" fill="#444441">业务方说"我要这个"</text>
  <text x="127" y="140" text-anchor="middle" font-size="12" fill="#444441">程序员说"哦，要这么实现"</text>

  <rect x="245" y="44" width="195" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="342" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#085041">建筑图纸</text>
  <text x="342" y="85" text-anchor="middle" font-size="11" fill="#0F6E56">画结构和关系</text>
  <text x="342" y="120" text-anchor="middle" font-size="12" fill="#444441">业主看布局、施工队看结构</text>
  <text x="342" y="140" text-anchor="middle" font-size="12" fill="#444441">水电工看管线、监理看规范</text>

  <rect x="460" y="44" width="195" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/>
  <text x="557" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#633806">本体模型</text>
  <text x="557" y="85" text-anchor="middle" font-size="11" fill="#854F0B">画概念、关系、规则</text>
  <text x="557" y="120" text-anchor="middle" font-size="12" fill="#444441">业务专家看概念</text>
  <text x="557" y="140" text-anchor="middle" font-size="12" fill="#444441">程序员看结构、AI 看推理</text>

  <line x1="127" y1="160" x2="127" y2="186" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="342" y1="160" x2="342" y2="186" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="557" y1="160" x2="557" y2="186" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3"/>

  <rect x="30" y="188" width="625" height="52" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="342" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#3C3489">本体 = 原型 + 图纸 + 说明书 的结合体</text>
  <text x="342" y="229" text-anchor="middle" font-size="11" fill="#534AB7">它像原型一样让人能看懂，像图纸一样把结构和关系画清楚，还能像说明书一样告诉 AI「这个世界怎么运转」</text>

  <text x="342" y="272" text-anchor="middle" font-size="12" fill="#5F5E5A">最大区别：原型和图纸是「给人看的」，本体是「人机共用的」</text>
  <text x="342" y="294" text-anchor="middle" font-size="12" fill="#5F5E5A">图纸不会推理，本体能 —— AI 能顺着关系链自己走</text>
</svg>
</body>
</html>
