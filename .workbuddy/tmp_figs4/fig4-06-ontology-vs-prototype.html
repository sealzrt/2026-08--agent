<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#ffffff}</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="100%" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <text x="340" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#444441">本体 vs 原型/图纸：差在哪</text>

  <rect x="40" y="44" width="290" height="200" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text x="185" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#444441">原型 / 图纸</text>
  <line x1="60" y1="82" x2="310" y2="82" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="60" y="108" font-size="12" font-weight="bold" fill="#5F5E5A">给谁看</text>
  <text x="150" y="108" font-size="12" fill="#444441">给人</text>
  <text x="60" y="138" font-size="12" font-weight="bold" fill="#5F5E5A">画什么</text>
  <text x="150" y="138" font-size="12" fill="#444441">界面 / 结构</text>
  <text x="60" y="168" font-size="12" font-weight="bold" fill="#5F5E5A">会推理吗</text>
  <text x="150" y="168" font-size="12" fill="#444441">不会，静态</text>
  <text x="60" y="198" font-size="12" font-weight="bold" fill="#5F5E5A">什么时候用</text>
  <text x="150" y="198" font-size="12" fill="#444441">开发前确认需求</text>
  <text x="60" y="226" font-size="12" font-weight="bold" fill="#5F5E5A">改一次</text>
  <text x="150" y="226" font-size="12" fill="#444441">重画一遍</text>

  <text x="340" y="144" text-anchor="middle" font-size="20" font-weight="bold" fill="#888780">VS</text>

  <rect x="350" y="44" width="290" height="200" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="495" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#3C3489">本体</text>
  <line x1="370" y1="82" x2="620" y2="82" stroke="#CECBF6" stroke-width="0.8"/>
  <text x="370" y="108" font-size="12" font-weight="bold" fill="#534AB7">给谁看</text>
  <text x="460" y="108" font-size="12" fill="#3C3489">人 + AI</text>
  <text x="370" y="138" font-size="12" font-weight="bold" fill="#534AB7">画什么</text>
  <text x="460" y="138" font-size="12" fill="#3C3489">概念·关系·规则</text>
  <text x="370" y="168" font-size="12" font-weight="bold" fill="#534AB7">会推理吗</text>
  <text x="460" y="168" font-size="12" fill="#3C3489">会，能沿关系链走</text>
  <text x="370" y="198" font-size="12" font-weight="bold" fill="#534AB7">什么时候用</text>
  <text x="460" y="198" font-size="12" fill="#3C3489">系统全生命周期</text>
  <text x="370" y="226" font-size="12" font-weight="bold" fill="#534AB7">改一次</text>
  <text x="460" y="226" font-size="12" fill="#3C3489">业务变了才改</text>

  <text x="340" y="276" text-anchor="middle" font-size="12" fill="#5F5E5A">原型是"开发前的一次对齐"；本体是"系统活着的时候，AI 随时能查的业务地图"</text>
  <text x="340" y="300" text-anchor="middle" font-size="12" fill="#5F5E5A">图纸钉在墙上不会动；本体活在系统里，跟着业务一起演化</text>
</svg>
</body>
</html>
