<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#ffffff}</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="100%" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <text x="340" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#444441">本体横着帮了六个模块</text>

  <rect x="55" y="44" width="170" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="140" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#0C447C">上下文管理</text>
  <text x="140" y="84" text-anchor="middle" font-size="11" fill="#185FA5">定位当前实体</text>
  <line x1="140" y1="96" x2="140" y2="156" stroke="#185FA5" stroke-width="1"/>

  <rect x="255" y="44" width="170" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="340" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#085041">记忆</text>
  <text x="340" y="84" text-anchor="middle" font-size="11" fill="#0F6E56">定义知识怎么组织</text>
  <line x1="340" y1="96" x2="340" y2="156" stroke="#0F6E56" stroke-width="1"/>

  <rect x="455" y="44" width="170" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="540" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#633806">工作流</text>
  <text x="540" y="84" text-anchor="middle" font-size="11" fill="#854F0B">定义流程路线</text>
  <line x1="540" y1="96" x2="540" y2="156" stroke="#854F0B" stroke-width="1"/>

  <rect x="55" y="104" width="170" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="140" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#712B13">工具</text>
  <text x="140" y="144" text-anchor="middle" font-size="11" fill="#993C1D">定义输入输出格式</text>
  <line x1="140" y1="156" x2="140" y2="176" stroke="#993C1D" stroke-width="1"/>

  <rect x="255" y="104" width="170" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="340" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#3C3489">权限</text>
  <text x="340" y="144" text-anchor="middle" font-size="11" fill="#534AB7">定义谁能改什么</text>
  <line x1="340" y1="156" x2="340" y2="176" stroke="#534AB7" stroke-width="1"/>

  <rect x="455" y="104" width="170" height="52" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
  <text x="540" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#791F1F">异常处理</text>
  <text x="540" y="144" text-anchor="middle" font-size="11" fill="#A32D2D">定义哪些算异常</text>
  <line x1="540" y1="156" x2="540" y2="176" stroke="#A32D2D" stroke-width="1"/>

  <rect x="40" y="176" width="600" height="46" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>
  <text x="340" y="204" text-anchor="middle" font-size="14" font-weight="bold" fill="#3C3489">本体（语义层）= 横梁：给六个模块递「规矩」</text>

  <text x="340" y="256" text-anchor="middle" font-size="12" fill="#5F5E5A">本体不在任何一层，却影响所有层 —— 六个模块按规矩干活</text>
</svg>
</body>
</html>
