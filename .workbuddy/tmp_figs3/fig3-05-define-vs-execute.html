<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#ffffff}</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="100%" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <text x="340" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#444441">谁定义、谁执行 —— 一条分界线</text>

  <rect x="40" y="70" width="230" height="140" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="155" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#3C3489">本体论</text>
  <text x="155" y="120" text-anchor="middle" font-size="12" fill="#534AB7">定口径</text>
  <line x1="65" y1="132" x2="245" y2="132" stroke="#534AB7" stroke-width="0.8"/>
  <text x="155" y="154" text-anchor="middle" font-size="11" fill="#534AB7">合同是啥、怎么理解业务</text>
  <text x="155" y="172" text-anchor="middle" font-size="11" fill="#534AB7">「谁能改金额」这个口径</text>
  <text x="155" y="190" text-anchor="middle" font-size="11" fill="#534AB7">不去实际推理、不存数据</text>

  <line x1="270" y1="100" x2="318" y2="100" stroke="#5F5E5A" stroke-width="1.2"/>
  <polygon points="320,100 312,96 312,104" fill="#5F5E5A"/>
  <line x1="270" y1="130" x2="318" y2="130" stroke="#5F5E5A" stroke-width="1.2"/>
  <polygon points="320,130 312,126 312,134" fill="#5F5E5A"/>
  <line x1="270" y1="160" x2="318" y2="160" stroke="#5F5E5A" stroke-width="1.2"/>
  <polygon points="320,160 312,156 312,164" fill="#5F5E5A"/>
  <text x="295" y="90" text-anchor="middle" font-size="11" fill="#5F5E5A">照着跑</text>

  <rect x="320" y="70" width="320" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="480" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#085041">规则引擎</text>
  <text x="480" y="105" text-anchor="middle" font-size="11" fill="#0F6E56">真跑"金额缺失→报错"判断</text>

  <rect x="320" y="124" width="320" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="480" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#085041">工作流引擎</text>
  <text x="480" y="159" text-anchor="middle" font-size="11" fill="#0F6E56">真执行"合同→审核→关联项目"</text>

  <rect x="320" y="178" width="320" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="480" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#085041">权限引擎</text>
  <text x="480" y="213" text-anchor="middle" font-size="11" fill="#0F6E56">真判断"项目经理能不能改金额"</text>

  <rect x="40" y="240" width="600" height="52" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/>
  <text x="340" y="264" text-anchor="middle" font-size="13" font-weight="bold" fill="#633806">Agent</text>
  <text x="340" y="282" text-anchor="middle" font-size="12" fill="#854F0B">理解目标，把本体和各引擎串起来，把事办成</text>

  <text x="340" y="316" text-anchor="middle" font-size="12" fill="#5F5E5A">本体定口径，引擎照着跑，Agent 凑一起 —— 谁也别越界，系统才不乱</text>
</svg>
</body>
</html>
