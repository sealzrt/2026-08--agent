<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#ffffff}</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="100%" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <text x="340" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#444441">三个容易踩的坑</text>

  <rect x="40" y="44" width="180" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="130" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#3C3489">本体 = 字典</text>
  <text x="130" y="88" text-anchor="middle" font-size="11" fill="#534AB7">管"合同是什么意思"</text>

  <text x="280" y="80" text-anchor="middle" font-size="18" font-weight="bold" fill="#888780">≠</text>

  <rect x="340" y="44" width="180" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="430" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#712B13">记忆 = 便签纸</text>
  <text x="430" y="88" text-anchor="middle" font-size="11" fill="#993C1D">临时记，聊完就扔</text>
  <text x="340" y="126" text-anchor="middle" font-size="11" fill="#5F5E5A">字典不会因为聊天结束就变，便签纸会</text>

  <rect x="40" y="144" width="180" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="130" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#3C3489">本体 = 法规书</text>
  <text x="130" y="188" text-anchor="middle" font-size="11" fill="#534AB7">描述规则的存在和含义</text>

  <text x="280" y="180" text-anchor="middle" font-size="18" font-weight="bold" fill="#888780">≠</text>

  <rect x="340" y="144" width="180" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="430" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#085041">规则引擎 = 交警</text>
  <text x="430" y="188" text-anchor="middle" font-size="11" fill="#0F6E56">真的跑"缺字段→报错"</text>
  <text x="340" y="226" text-anchor="middle" font-size="11" fill="#5F5E5A">法规书写着规则，交警在路口执行，各干各的</text>

  <text x="340" y="256" text-anchor="middle" font-size="12" fill="#5F5E5A">本体不是"第七个零件"：它不给模块干活，只给它们统一口径</text>
</svg>
</body>
</html>
