  <rect x="80" y="126" width="520" height="62" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="2"/>

  <text x="100" y="172" font-size="12" fill="#993C1D">实体、关系、规则、边界</text>

  <text x="100" y="317" font-size="12" fill="#534AB7">规划任务、调用工具</text>

  <text x="340" y="356" text-anchor="middle" font-size="13" fill="#444441">模型负责说话，本体负责懂世界 —— 本体是地基，不是可选项</text>
