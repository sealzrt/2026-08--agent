<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#ffffff}</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="100%" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <text x="340" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#444441">五个概念，各管一段</text>

  <rect x="40" y="48" width="210" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="60" y="70" font-size="13" font-weight="bold" fill="#0C447C">本体论 = 字典</text>
  <text x="60" y="88" font-size="11" fill="#185FA5">词怎么解释</text>
  <rect x="260" y="48" width="380" height="50" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="280" y="77" font-size="12" fill="#444441">定义概念：合同是啥、和项目啥关系</text>

  <rect x="40" y="106" width="210" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="60" y="128" font-size="13" font-weight="bold" fill="#085041">知识图谱 = 档案柜</text>
  <text x="60" y="146" font-size="11" fill="#0F6E56">具体谁干了啥</text>
  <rect x="260" y="106" width="380" height="50" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="280" y="135" font-size="12" fill="#444441">存事实：HT-001 的金额、约束哪个项目</text>

  <rect x="40" y="164" width="210" height="50" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="60" y="186" font-size="13" font-weight="bold" fill="#633806">RAG = 原文库</text>
  <text x="60" y="204" font-size="11" fill="#854F0B">原文在哪</text>
  <rect x="260" y="164" width="380" height="50" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="280" y="193" font-size="12" fill="#444441">翻原文：合同第 3 章验收条款怎么写的</text>

  <rect x="40" y="222" width="210" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="60" y="244" font-size="13" font-weight="bold" fill="#712B13">记忆 = 便签纸</text>
  <text x="60" y="262" font-size="11" fill="#993C1D">临时的</text>
  <rect x="260" y="222" width="380" height="50" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="280" y="251" font-size="12" fill="#444441">记上下文：用户上一轮刚确认按固定总价</text>

  <rect x="40" y="280" width="210" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="60" y="302" font-size="13" font-weight="bold" fill="#3C3489">Agent = 调度员</text>
  <text x="60" y="320" font-size="11" fill="#534AB7">把事办成</text>
  <rect x="260" y="280" width="380" height="50" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="280" y="309" font-size="12" fill="#444441">把它们拼起来，回答用户</text>

  <rect x="40" y="350" width="600" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="340" y="372" text-anchor="middle" font-size="13" font-weight="bold" fill="#0C447C">同一个问题贯穿：「合同 HT-001 的验收条款风险」</text>
  <text x="340" y="391" text-anchor="middle" font-size="11" fill="#185FA5">字典给概念 → 档案柜给事实 → 原文库给原文 → 便签纸给上下文 → 调度员拼出答案</text>
</svg>
</body>
</html>
