<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#ffffff}</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="100%" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <text x="340" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#444441">传统系统 vs AI 原生系统</text>

  <rect x="40" y="56" width="290" height="252" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text x="185" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#444441">传统信息化系统</text>
  <line x1="60" y1="96" x2="310" y2="96" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="60" y="124" font-size="12" font-weight="bold" fill="#5F5E5A">核心</text>
  <text x="140" y="124" font-size="12" fill="#444441">记录、流程</text>
  <text x="60" y="156" font-size="12" font-weight="bold" fill="#5F5E5A">数据</text>
  <text x="140" y="156" font-size="12" fill="#444441">躺着等人查</text>
  <text x="60" y="188" font-size="12" font-weight="bold" fill="#5F5E5A">规则</text>
  <text x="140" y="188" font-size="12" fill="#444441">散在代码里（if 加 if）</text>
  <text x="60" y="220" font-size="12" font-weight="bold" fill="#5F5E5A">几年后</text>
  <text x="140" y="220" font-size="12" fill="#444441">没人说得清（黑盒）</text>
  <text x="185" y="266" text-anchor="middle" font-size="11" fill="#5F5E5A">AI 接进去只能看到表层</text>

  <text x="340" y="180" text-anchor="middle" font-size="22" font-weight="bold" fill="#888780">VS</text>

  <rect x="350" y="56" width="290" height="252" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="495" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#0C447C">AI-Native 系统</text>
  <line x1="370" y1="96" x2="620" y2="96" stroke="#85B7EB" stroke-width="0.8"/>
  <text x="370" y="124" font-size="12" font-weight="bold" fill="#185FA5">核心</text>
  <text x="450" y="124" font-size="12" fill="#0C447C">认知、演化</text>
  <text x="370" y="156" font-size="12" font-weight="bold" fill="#185FA5">数据</text>
  <text x="450" y="156" font-size="12" fill="#0C447C">自己理解、推理、触发</text>
  <text x="370" y="188" font-size="12" font-weight="bold" fill="#185FA5">规则</text>
  <text x="450" y="188" font-size="12" fill="#0C447C">收进本体，集中维护</text>
  <text x="370" y="220" font-size="12" font-weight="bold" fill="#185FA5">几年后</text>
  <text x="450" y="220" font-size="12" fill="#0C447C">认知沉淀为可查询的结构</text>
  <text x="495" y="266" text-anchor="middle" font-size="11" fill="#185FA5">AI 在结构化的业务世界里推理</text>

  <text x="340" y="340" text-anchor="middle" font-size="13" fill="#444441">本体论 = 把专家脑子里的认知「搬」出来，变成系统能推理的结构</text>
</svg>
</body>
</html>
