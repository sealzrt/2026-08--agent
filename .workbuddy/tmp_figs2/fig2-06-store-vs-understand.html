<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#ffffff}</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="100%" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <text x="340" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#444441">同一件事：存数据 vs 理解数据</text>

  <rect x="40" y="56" width="250" height="170" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text x="60" y="80" font-size="13" font-weight="bold" fill="#444441">用户表（一行记录）</text>
  <line x1="60" y1="90" x2="270" y2="90" stroke="#B4B2A9" stroke-width="0.8"/>
  <line x1="60" y1="108" x2="270" y2="108" stroke="#B4B2A9" stroke-width="0.8"/>
  <line x1="100" y1="90" x2="100" y2="108" stroke="#B4B2A9" stroke-width="0.8"/>
  <line x1="150" y1="90" x2="150" y2="108" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="80" y="103" text-anchor="middle" font-size="11" font-weight="bold" fill="#5F5E5A">id</text>
  <text x="125" y="103" text-anchor="middle" font-size="11" font-weight="bold" fill="#5F5E5A">name</text>
  <text x="210" y="103" text-anchor="middle" font-size="11" font-weight="bold" fill="#5F5E5A">dept</text>
  <line x1="60" y1="126" x2="270" y2="126" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="80" y="141" text-anchor="middle" font-size="11" fill="#444441">1</text>
  <text x="125" y="141" text-anchor="middle" font-size="11" fill="#444441">张三</text>
  <text x="210" y="141" text-anchor="middle" font-size="11" fill="#444441">技术部</text>
  <line x1="60" y1="150" x2="270" y2="150" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="165" y="192" text-anchor="middle" font-size="11" fill="#5F5E5A">躺着等人查，不知道他是谁</text>

  <text x="340" y="141" text-anchor="middle" font-size="22" font-weight="bold" fill="#888780">VS</text>

  <rect x="390" y="56" width="250" height="170" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <ellipse cx="515" cy="112" rx="46" ry="24" fill="#FFFFFF" stroke="#185FA5" stroke-width="1.2"/>
  <text x="515" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#0C447C">张三</text>
  <text x="515" y="124" text-anchor="middle" font-size="11" fill="#185FA5">Person</text>

  <line x1="480" y1="102" x2="420" y2="86" stroke="#185FA5" stroke-width="1"/>
  <line x1="555" y1="102" x2="620" y2="92" stroke="#185FA5" stroke-width="1"/>
  <line x1="540" y1="130" x2="610" y2="176" stroke="#185FA5" stroke-width="1"/>

  <rect x="410" y="70" width="110" height="28" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="465" y="88" text-anchor="middle" font-size="11" fill="#085041">属于 → 技术部（组织）</text>
  <rect x="585" y="78" width="95" height="28" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="632" y="96" text-anchor="middle" font-size="11" fill="#633806">具备 → Java（技能）</text>
  <rect x="560" y="168" width="120" height="28" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="620" y="186" text-anchor="middle" font-size="11" fill="#712B13">触发 → 升级审批（动作）</text>

  <text x="515" y="210" text-anchor="middle" font-size="11" fill="#185FA5">活的实体：知道自己在哪、能干什么</text>

  <text x="340" y="272" text-anchor="middle" font-size="13" fill="#444441">从「存」到「理解」，一字之差 —— 后面所有能力的地基</text>
</svg>
</body>
</html>
